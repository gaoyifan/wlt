[package]
name = "wlt"
version = "2.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
askama = "0.16.0"
axum = "0.8.9"
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
bytes = "1.12.0"
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3.32", features = ["sink"] }
hickory-net = "0.26.1"
hickory-proto = "0.26.1"
hickory-resolver = "0.26.1"
http = "1.4.2"
http-body-util = "0.1.3"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http2", "tokio"] }
indexmap = { version = "2.14.0", features = ["serde"] }
ipnet = { version = "2.12.0", features = ["serde"] }
metrics = "0.24.3"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
moka = { version = "0.12.15", features = ["future"] }
netlink-packet-core = "0.9.0"
netlink-packet-netfilter = "0.4.0"
netlink-proto = { version = "0.13.0", features = ["tokio_socket"] }
nftables = { version = "0.6.3", features = ["tokio"] }
prefix-trie = "0.8.4"
rand = "0.10"
regex = "1.12.3"
rtnetlink = { version = "0.23.0", features = ["tokio_socket"] }
russh = { version = "0.62.2", default-features = false, features = ["flate2", "ring", "rsa"] }
rustls = { version = "0.23.41", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "net", "time", "io-util", "sync"] }
socket2 = { version = "0.6.5", features = ["all"] }
tokio-util = { version = "0.7.18", features = ["codec", "rt"] }
toml = { version = "1.1.2", features = ["preserve_order"] }
tower-service = "0.3.3"
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
